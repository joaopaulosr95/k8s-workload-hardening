name: ci

on:
  push:
    branches: [main]
  pull_request:

# A push to a branch with an open PR would otherwise run this twice, and the
# kind job is the expensive half.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A fresh clone has no vendor/ — it is gitignored — so every run
          # resolves modules from go.sum. Caching is worth having here, and
          # the k8s.io tree is most of what it saves.
          cache: true
      - name: go vet
        run: go vet ./pkg/... ./cmd/...
      - name: Unit tests
        run: make test
      - name: Coverage floor
        run: make cover

      - name: Reference documentation names things that exist
        run: |
          set -euo pipefail
          fail=0
          # Only the two tables that list API constants. Scoping matters: the
          # Custom resources table also starts rows with a backticked
          # CamelCase word, and an unscoped sweep would demand a Phase named
          # NetworkIsolation.
          section() { awk -v s="$1" '$0=="## "s{f=1;next} /^## /{f=0} f' docs/reference.md; }

          # Every hardening.acme.corp/* key the reference names must be a
          # constant in the API package. A documented key that no longer
          # exists is the failure that matters, because a reader cannot notice.
          # [a-z0-9-]+ then drop the apiVersion: a [a-z-]+ class stops at the
          # digit in hardening.acme.corp/v1alpha1 and demands a constant named
          # for the truncated "hardening.acme.corp/v".
          for k in $(grep -oE 'hardening\.acme\.corp/[a-z0-9-]+' docs/reference.md \
                     | grep -vE '^hardening\.acme\.corp/v[0-9]' | sort -u); do
            grep -qrF "\"$k\"" pkg/apis/v1alpha1/ \
              || { echo "reference names $k, which is no constant in pkg/apis/v1alpha1"; fail=1; }
          done
          # [[:space:]]* around the = because gofmt aligns const blocks, and a
          # single-space regex silently matches nothing at all.
          for v in $(section Phases | grep -oE '^\| `[A-Za-z]+`' | tr -d '|` '); do
            grep -qrE "Phase[[:space:]]*=[[:space:]]*\"$v\"" pkg/apis/v1alpha1/ \
              || { echo "reference names phase $v, which is no constant in pkg/apis/v1alpha1"; fail=1; }
          done
          for v in $(section 'Per-target outcomes' | grep -oE '^\| `[A-Za-z]+`' | tr -d '|` '); do
            grep -qrE "Outcome[A-Za-z]*[[:space:]]*=[[:space:]]*\"$v\"" pkg/apis/v1alpha1/ \
              || { echo "reference names outcome $v, which is no constant in pkg/apis/v1alpha1"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "ok: every documented identifier exists"
          exit "$fail"

      - name: Documentation names make targets that exist
        run: |
          set -euo pipefail
          fail=0
          # `make -n` prints the recipe without running it, so this needs no
          # cluster. A renamed target is otherwise invisible until a reader
          # types it.
          for t in $(grep -rhoE '\bmake [a-z][a-z-]*' README.md docs/*.md | cut -d' ' -f2 | sort -u); do
            make -n "$t" >/dev/null 2>&1 \
              || { echo "documentation names 'make $t', which does not exist"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "ok: every documented make target exists"
          exit "$fail"

      - name: CRD schemas and CEL rules (envtest)
        run: |
          set -euo pipefail
          out=$(make test-envtest GOTESTFLAGS=-v 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # The suite exits 0 when the control-plane assets are missing, so
          # `ok` alone does not mean it ran. Assert a named test reported a
          # result: absent it, the assets never arrived.
          printf '%s' "$out" | grep -q -- '--- PASS: TestHardeningTransitionRule' || {
            echo "envtest did not run: the control-plane assets were not fetched"; exit 1; }

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create the cluster
        uses: helm/kind-action@v1
        with:
          # Must match CLUSTER in the Makefile: `kind load docker-image`
          # names the cluster explicitly, and a mismatch loads the image
          # into a cluster kubectl is not pointing at.
          cluster_name: hardening
          config: hack/kind/cluster.yaml
      - name: CRD schema and CEL rules
        run: make verify-crd
      - name: NetworkIsolation and WorkloadHardening, end to end
        run: make verify

      - name: Metrics endpoint
        run: |
          set -euo pipefail
          KUBECTL="kubectl --context=kind-hardening"
          $KUBECTL -n isolation-system rollout status deployment/k8s-workload-hardening --timeout=120s

          # Retry, and separate "no body" from "missing series". `kubectl run -i`
          # captures only stdout, so a probe pod that never started -- a slow
          # image pull is enough -- yields an empty body, and a series check on
          # an empty string reports the first metric as missing. That is a
          # different failure wearing the same message, and it is the one that
          # actually happened. A fresh pod name per attempt because --rm does
          # not clean up a pod that failed to start.
          body=""
          for i in 1 2 3 4 5; do
            if body=$($KUBECTL -n isolation-system run "metrics-probe-$i" \
                        --rm -i --restart=Never --image=curlimages/curl:8.11.1 --quiet -- \
                        -sS --max-time 15 http://k8s-workload-hardening-metrics:8080/metrics 2>/dev/null) \
               && [ -n "$body" ]; then
              break
            fi
            echo "probe attempt $i returned nothing; retrying"
            body=""
            sleep 10
          done
          if [ -z "$body" ]; then
            echo "the metrics probe never returned a body: the endpoint was not reached at all"
            $KUBECTL -n isolation-system get svc,endpoints,pod -l app=k8s-workload-hardening
            exit 1
          fi

          # Assert known series, not a 200. A port that is bound but serving an
          # empty body looks identical to a healthy one from the manifest. This
          # runs after `make verify`, so a real reconcile has exercised them --
          # hardening_reconcile_total is a CounterVec and emits no TYPE line
          # until its first observation.
          for want in hardening_reconcile_total hardening_targets_patched_total \
                      hardening_dryrun_refusals_total hardening_queue_depth; do
            printf '%s' "$body" | grep -q "^# TYPE $want" || {
              echo "missing: $want"; printf '%s\n' "$body" | grep '^hardening_' || true; exit 1; }
          done
          echo "ok: /metrics serves every declared series"
      - name: Controller logs on failure
        if: failure()
        run: kubectl --context=kind-hardening -n isolation-system logs deployment/k8s-workload-hardening --tail=200 || true
