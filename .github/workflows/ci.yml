name: ci

on:
  push:
    branches: [main]
  pull_request:

# A push to a branch with an open PR would otherwise run this twice, and the
# kind job is the expensive half.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A fresh clone has no vendor/ — it is gitignored — so every run
          # resolves modules from go.sum. Caching is worth having here, and
          # the k8s.io tree is most of what it saves.
          cache: true
      - name: go vet
        run: go vet ./pkg/... ./cmd/...
      - name: Unit tests
        run: make test
      - name: Coverage floor
        run: make cover

      - name: CRD schemas and CEL rules (envtest)
        run: |
          set -euo pipefail
          out=$(make test-envtest GOTESTFLAGS=-v 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          # The suite exits 0 when the control-plane assets are missing, so
          # `ok` alone does not mean it ran. Assert a named test reported a
          # result: absent it, the assets never arrived.
          printf '%s' "$out" | grep -q -- '--- PASS: TestHardeningTransitionRule' || {
            echo "envtest did not run: the control-plane assets were not fetched"; exit 1; }

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create the cluster
        uses: helm/kind-action@v1
        with:
          # Must match CLUSTER in the Makefile: `kind load docker-image`
          # names the cluster explicitly, and a mismatch loads the image
          # into a cluster kubectl is not pointing at.
          cluster_name: hardening
          config: hack/kind/cluster.yaml
      - name: CRD schema and CEL rules
        run: make verify-crd
      - name: NetworkIsolation and WorkloadHardening, end to end
        run: make verify

      - name: Metrics endpoint
        run: |
          set -euo pipefail
          KUBECTL="kubectl --context=kind-hardening"
          $KUBECTL -n isolation-system rollout status deployment/k8s-workload-hardening --timeout=120s
          # Assert known series, not a 200. A port that is bound but serving an
          # empty body looks identical to a healthy one from the manifest. This
          # runs after `make verify`, so a real reconcile has exercised them --
          # hardening_reconcile_total is a CounterVec and emits no TYPE line
          # until its first observation.
          body=$($KUBECTL -n isolation-system run metrics-probe \
            --rm -i --restart=Never --image=curlimages/curl:8.11.1 --quiet -- \
            -sS --max-time 10 http://k8s-workload-hardening-metrics:8080/metrics)
          for want in hardening_reconcile_total hardening_targets_patched_total \
                      hardening_dryrun_refusals_total hardening_queue_depth; do
            printf '%s' "$body" | grep -q "^# TYPE $want" || { echo "missing: $want"; exit 1; }
          done
          echo "ok: /metrics serves every declared series"
      - name: Controller logs on failure
        if: failure()
        run: kubectl --context=kind-hardening -n isolation-system logs deployment/k8s-workload-hardening --tail=200 || true
