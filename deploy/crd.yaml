apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkisolations.hardening.acme.corp
spec:
  group: hardening.acme.corp
  scope: Namespaced
  names:
    plural: networkisolations
    singular: networkisolation
    kind: NetworkIsolation
    shortNames: [netiso]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Matched-A
          type: integer
          jsonPath: .status.matchedA
        - name: Matched-B
          type: integer
          jsonPath: .status.matchedB
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Blocks direct network traffic between two pod groups. Creating the
            object requests isolation; deleting it restores the previous
            connectivity.
          required: [spec]
          properties:
            spec:
              type: object
              required: [a, b]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: >-
                    spec is immutable; delete this object, wait for cleanup,
                    and create a new one to retarget
              properties:
                a: &group
                  type: object
                  required: [namespace, podSelector]
                  properties:
                    namespace:
                      type: string
                      maxLength: 63
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                    podSelector:
                      type: object
                      required: [matchLabels]
                      properties:
                        matchLabels:
                          type: object
                          description: 1-8 equality requirements. All must match.
                          minProperties: 1
                          maxProperties: 8
                          additionalProperties:
                            type: string
                            maxLength: 63
                            pattern: '^(|[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?)$'
                          x-kubernetes-validations:
                            - rule: >-
                                self.all(k, k.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$'))
                              message: every key must be a valid Kubernetes label key
                        matchExpressions:
                          type: array
                          description: >-
                            Not supported. The controller generates the
                            negations itself; operators supply equality maps
                            only.
                          maxItems: 0
                          items:
                            type: object
                            properties:
                              key: {type: string}
                              operator: {type: string}
                              values:
                                type: array
                                items: {type: string}
                b: *group
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Rejected, Active, Degraded, Deleting]
                message:
                  type: string
                policies:
                  type: array
                  items: {type: string}
                matchedA:
                  type: integer
                matchedB:
                  type: integer
                lastReconcileTime:
                  type: string
                  format: date-time
