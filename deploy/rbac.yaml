apiVersion: v1
kind: Namespace
metadata:
  name: isolation-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-isolation
  namespace: isolation-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-isolation
rules:
  # Target namespaces are chosen at runtime, so this cannot be namespace-scoped.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  # Read-only: membership, existence and hostNetwork checks. No workload reads,
  # no exec, no secrets.
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hardening.acme.corp"]
    resources: ["networkisolations"]
    # patch, not just update: the finalizer is written with a merge patch
    # scoped to metadata, so spec is never round-tripped back to the server.
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["hardening.acme.corp"]
    resources: ["networkisolations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["hardening.acme.corp"]
    resources: ["networkisolations/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-isolation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-isolation
subjects:
  - kind: ServiceAccount
    name: network-isolation
    namespace: isolation-system
